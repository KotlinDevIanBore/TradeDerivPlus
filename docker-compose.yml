# Local development dependencies. The API itself runs on the host via `go run`.
services:
  db:
    image: postgres:16-alpine
    container_name: tradederivplus-db
    environment:
      POSTGRES_USER: tdp
      POSTGRES_PASSWORD: tdp
      POSTGRES_DB: tradederivplus
    ports:
      # 5434 on the host to avoid colliding with a local Postgres or another
      # project's container.
      - "5434:5432"
    volumes:
      - tdp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tdp -d tradederivplus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # No longer behind a profile. It was `profiles: ["observability"]`, which meant
  # the ledger-drift alarm -- the one guarding the invariant the whole money design
  # rests on -- only ran for someone who opted in. See
  # docs/investigation-money-mechanics.md finding 2. Read the caveat in
  # docs/implementation-money-mechanics-fixes.md before treating this as
  # production monitoring: a compose stack on a laptop is not that.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: tradederivplus-prometheus
    depends_on: [alertmanager]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      # The scrape token. Create it with:
      #   echo -n "$METRICS_TOKEN" > deploy/prometheus/metrics_token
      - ./deploy/prometheus/metrics_token:/etc/prometheus/metrics_token:ro
      - tdp_prometheus:/prometheus
    extra_hosts:
      # Lets the container scrape the API running on the host.
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: tradederivplus-grafana
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    ports:
      - "3000:3000"
    volumes:
      # Datasource and dashboards are provisioned from files in git, so they
      # survive the container and are reviewable in a pull request.
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/dashboards:ro
      - tdp_grafana:/var/lib/grafana

  # Alertmanager was absent entirely, which meant a firing rule reached
  # Prometheus's own web UI and stopped there -- nobody was notified of anything.
  # Slack was chosen over PagerDuty or email because it needs one incoming-webhook
  # URL and no account provisioning, SMTP relay or paid subscription: the cheapest
  # thing that puts a critical money alert in front of a person.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: tradederivplus-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      # The whole directory, so the webhook-URL file can be absent on a fresh
      # clone without docker creating a directory in its place. The real
      # slack_webhook_url is gitignored; slack_webhook_url.example is not.
      - ./deploy/alertmanager:/etc/alertmanager:ro
      - tdp_alertmanager:/alertmanager

volumes:
  tdp_pgdata:
  tdp_prometheus:
  tdp_grafana:
  tdp_alertmanager:
