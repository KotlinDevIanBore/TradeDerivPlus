# Where a firing alert goes. Before this file existed, nowhere: Prometheus had
# rules and no Alertmanager, so an alert reached Prometheus's own UI and stopped.
#
# Slack, by incoming webhook, chosen for being the least infrastructure that puts
# a critical money alert in front of a person -- one URL, no account
# provisioning, no SMTP relay, no paid subscription. Swap the receiver for
# PagerDuty or email if there is an on-call rota to page.
global:
  resolve_timeout: 5m

route:
  receiver: money-critical
  # Group so a drift affecting several accounts is one message, not one per
  # account, but keep the wait short: these are not chatty alerts.
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  # Re-send while unresolved. A payout of unknown outcome holds a customer's
  # debit, so a message that scrolled past should come back.
  repeat_interval: 1h
  routes:
    # Warnings share the receiver for now, with a slower repeat. Split them once
    # there is somewhere quieter to send them.
    - matchers: [severity="warning"]
      receiver: money-critical
      repeat_interval: 12h

receivers:
  - name: money-critical
    slack_configs:
      # From a FILE, not an environment variable: Alertmanager does no ${VAR}
      # expansion in this config, and an empty api_url is a load-time error that
      # stops the container outright (verified -- it exits 1 with
      # `unsupported scheme "" for URL`). The file is read when a notification is
      # sent, so a missing one leaves Alertmanager running and showing alerts in
      # its own UI while unable to deliver them: a visibly half-configured state
      # rather than a dead one.
      #
      # Same convention as deploy/prometheus/metrics_token. Create it with:
      #   cp deploy/alertmanager/slack_webhook_url.example deploy/alertmanager/slack_webhook_url
      #   # then put the real incoming-webhook URL in it
      - api_url_file: /etc/alertmanager/slack_webhook_url
        channel: '#alerts'
        send_resolved: true
        title: '[{{ .CommonLabels.severity | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}{{ .Annotations.summary }}
          {{ .Annotations.description }}
          {{ end }}
