groups:
  - name: tradederivplus-money
    rules:
      # The invariant the whole money design rests on. Anything but zero means
      # a balance moved without a matching ledger row, which is the one class
      # of bug that silently destroys money. Two minutes of tolerance lets a
      # sampling race settle without suppressing a real drift.
      - alert: LedgerDrift
        expr: ledger_drift_accounts > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} account(s) drifted from the ledger"
          description: >-
            A wallet balance disagrees with the sum of its ledger rows.
            Stop and investigate before processing further withdrawals.

      # A payout whose outcome is genuinely unknown. The customer has ALREADY been
      # debited and there is no safe automatic resolution: refunding might pay
      # someone who was also paid by Safaricom, so the code deliberately refuses to
      # guess and waits for a human. That makes this the one money alert where the
      # alarm IS the remediation path -- nothing else will clear it.
      #
      # No `for:` clause. A stale deposit can resolve itself; this cannot, so there
      # is no settling period worth waiting out.
      - alert: PayoutOutcomeUnknown
        expr: mpesa_payouts_unknown > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} payout(s) of unknown outcome, customer already debited"
          description: >-
            A B2C payout could not be confirmed either way. The balance is already
            debited. Confirm each against the Safaricom B2C portal (Transaction
            Status for the OriginatorConversationID), then resolve it in the admin
            console as paid, failed, or never_received. Do not guess: a wrong
            refund pays twice.

      # Past the give-up horizon, so the reconciliation pass has stopped asking.
      # Distinct from the above because nothing is looking any more -- these will
      # sit until someone acts, however long that is.
      - alert: PayoutGivenUp
        expr: mpesa_payouts_given_up > 0
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} open payout(s) past the give-up horizon"
          description: >-
            The reconciliation pass has stopped querying these. No automated path
            will resolve them. Same remediation as PayoutOutcomeUnknown.

      # A Daraja outage shows up as failures long before users complain.
      - alert: DepositFailureRate
        expr: >-
          sum(rate(deposits_total{status="failed"}[10m]))
          /
          clamp_min(sum(rate(deposits_total[10m])), 0.001) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "More than half of deposits are failing"
          description: "Check Daraja availability and the callback URL."

  - name: tradederivplus-api
    rules:
      - alert: HighErrorRate
        expr: >-
          sum(rate(http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_requests_total[5m])), 0.001) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Over 5% of requests are failing with a server error"

      - alert: APIDown
        expr: up{job="tradederivplus-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The API is not being scraped"
